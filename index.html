<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FTC Decode Scouting & Leaderboard</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <style>
        body { background-color: #0f172a; color: #f8fafc; }
    </style>
</head>
<body class="p-6 max-w-7xl mx-auto">

    <header class="mb-8 text-center border-b border-slate-700 pb-6">
        <h1 class="text-4xl font-extrabold text-amber-500 tracking-wide">FTC DECODE</h1>
        <p class="text-slate-400 mt-2">Robot Performance Tracker & Leaderboard</p>
    </header>

    <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
        <div class="bg-slate-800 p-6 rounded-xl shadow-xl border border-slate-700 h-fit">
            <h2 class="text-xl font-bold mb-4 text-amber-400 border-b border-slate-700 pb-2">Log Match Data</h2>
            <form id="matchForm" class="space-y-4">
                <div class="flex items-end gap-2">
                    <div class="flex-1">
                        <label class="block text-sm font-medium text-slate-300">Team Number</label>
                        <input type="number" id="teamNumber" required class="mt-1 w-full p-2.5 bg-slate-900 border border-slate-600 rounded-lg focus:ring-2 focus:ring-amber-500 focus:outline-none text-white">
                    </div>
                    <button type="button" id="fetchVideosBtn" class="bg-indigo-600 hover:bg-indigo-700 text-white font-semibold py-2.5 px-3 rounded-lg text-sm transition h-[46px] cursor-pointer whitespace-nowrap">
                        🔍 Find Videos
                    </button>
                </div>
                <div>
                    <label class="block text-sm font-medium text-slate-300">Team Name</label>
                    <input type="text" id="teamName" required class="mt-1 w-full p-2.5 bg-slate-900 border border-slate-600 rounded-lg focus:ring-2 focus:ring-amber-500 focus:outline-none text-white">
                </div>
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-medium text-slate-300">Artifacts Scored</label>
                        <input type="number" id="artifacts" min="0" required class="mt-1 w-full p-2.5 bg-slate-900 border border-slate-600 rounded-lg focus:ring-2 focus:ring-amber-500 focus:outline-none text-white">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-slate-300">Avg Cycle Time (s)</label>
                        <input type="number" id="cycleTime" min="0" step="0.1" required class="mt-1 w-full p-2.5 bg-slate-900 border border-slate-600 rounded-lg focus:ring-2 focus:ring-amber-500 focus:outline-none text-white">
                    </div>
                </div>
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-medium text-slate-300">Robot Score Contribution</label>
                        <input type="number" id="robotScore" min="0" required class="mt-1 w-full p-2.5 bg-slate-900 border border-slate-600 rounded-lg focus:ring-2 focus:ring-amber-500 focus:outline-none text-white">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-slate-300">Total Alliance Score</label>
                        <input type="number" id="allianceScore" min="1" required class="mt-1 w-full p-2.5 bg-slate-900 border border-slate-600 rounded-lg focus:ring-2 focus:ring-amber-500 focus:outline-none text-white">
                    </div>
                </div>
                <button type="submit" class="w-full bg-amber-500 hover:bg-amber-600 text-slate-950 font-bold py-3 px-4 rounded-lg transition duration-200 shadow-md cursor-pointer">
                    Submit Match Data
                </button>
            </form>
        </div>

        <div class="lg:col-span-2 bg-slate-800 p-6 rounded-xl shadow-xl border border-slate-700">
            <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between mb-6 gap-4">
                <h2 class="text-xl font-bold text-amber-400">Team Leaderboard</h2>
                <div class="flex items-center gap-2">
                    <label class="text-sm font-medium text-slate-300 whitespace-nowrap">Sort By:</label>
                    <select id="sortBy" class="p-2 bg-slate-900 border border-slate-600 rounded-lg text-white focus:ring-2 focus:ring-amber-500 focus:outline-none">
                        <option value="artifacts">Max Artifacts Scored</option>
                        <option value="cycleTime">Fastest Cycle Time</option>
                        <option value="contribution">Highest Alliance Contribution %</option>
                    </select>
                </div>
            </div>

            <div class="overflow-x-auto rounded-lg border border-slate-700">
                <table class="w-full text-left border-collapse">
                    <thead>
                        <tr class="bg-slate-900 text-slate-300 text-sm border-b border-slate-700">
                            <th class="p-4 font-semibold">Rank</th>
                            <th class="p-4 font-semibold">Team</th>
                            <th class="p-4 font-semibold text-center">Max Artifacts</th>
                            <th class="p-4 font-semibold text-center">Avg Cycle (s)</th>
                            <th class="p-4 font-semibold text-center">Alliance Cont. %</th>
                            <th class="p-4 font-semibold text-center">Actions</th>
                        </tr>
                    </thead>
                    <tbody id="leaderboardBody" class="divide-y divide-slate-700/50 text-slate-100">
                        </tbody>
                </table>
            </div>
            <div id="emptyState" class="text-center py-12 text-slate-500 hidden">
                No team data logged yet. Fill out the form to populate the leaderboard!
            </div>
        </div>
    </div>

    <script>
        let teamsData = JSON.parse(localStorage.getItem('ftcDecodeData')) || [];

        const matchForm = document.getElementById('matchForm');
        const sortBySelect = document.getElementById('sortBy');
        const leaderboardBody = document.getElementById('leaderboardBody');
        const emptyState = document.getElementById('emptyState');
        const fetchVideosBtn = document.getElementById('fetchVideosBtn');

        // Dynamic Video Finder Link Logic
        fetchVideosBtn.addEventListener('click', () => {
            const teamNumber = document.getElementById('teamNumber').value.trim();
            if (!teamNumber) {
                alert('Please enter a team number first!');
                return;
            }
            // Directs the scout to the specific team profile on FTCVideos
            const url = `https://ftcvideos.org/?team=${teamNumber}`;
            window.open(url, '_blank');
        });

        // Form submission logic
        matchForm.addEventListener('submit', (e) => {
            e.preventDefault();

            const teamNumber = document.getElementById('teamNumber').value.trim();
            const teamName = document.getElementById('teamName').value.trim();
            const artifacts = parseInt(document.getElementById('artifacts').value);
            const cycleTime = parseFloat(document.getElementById('cycleTime').value);
            const robotScore = parseInt(document.getElementById('robotScore').value);
            const allianceScore = parseInt(document.getElementById('allianceScore').value);

            const contributionPct = Math.min(Math.round((robotScore / allianceScore) * 100), 100);
            const existingTeamIndex = teamsData.findIndex(t => t.number === teamNumber);

            if (existingTeamIndex > -1) {
                const team = teamsData[existingTeamIndex];
                team.artifacts = Math.max(team.artifacts, artifacts);
                team.cycleTime = parseFloat(((team.cycleTime + cycleTime) / 2).toFixed(2));
                team.contribution = Math.max(team.contribution, contributionPct);
            } else {
                teamsData.push({
                    number: teamNumber,
                    name: teamName,
                    artifacts: artifacts,
                    cycleTime: cycleTime,
                    contribution: contributionPct
                });
            }

            saveData();
            renderLeaderboard();
            matchForm.reset();
        });

        function deleteTeam(index) {
            teamsData.splice(index, 1);
            saveData();
            renderLeaderboard();
        }

        function saveData() {
            localStorage.setItem('ftcDecodeData', JSON.stringify(teamsData));
        }

        function renderLeaderboard() {
            const sortBy = sortBySelect.value;
            
            teamsData.sort((a, b) => {
                if (sortBy === 'cycleTime') {
                    return a.cycleTime - b.cycleTime;
                } else {
                    return b[sortBy] - a[sortBy];
                }
            });

            if (teamsData.length === 0) {
                emptyState.classList.remove('hidden');
                leaderboardBody.innerHTML = '';
                return;
            } else {
                emptyState.classList.add('hidden');
            }

            leaderboardBody.innerHTML = teamsData.map((team, index) => {
                let rankBadge = index + 1;
                if (index === 0) rankBadge = '🥇';
                else if (index === 1) rankBadge = '🥈';
                else if (index === 2) rankBadge = '🥉';

                return `
                    <tr class="hover:bg-slate-700/30 transition">
                        <td class="p-4 font-bold text-center w-16">${rankBadge}</td>
                        <td class="p-4">
                            <span class="font-bold text-amber-500">#${team.number}</span>
                            <div class="text-sm text-slate-400 font-medium">${team.name}</div>
                        </td>
                        <td class="p-4 text-center font-semibold text-emerald-400">${team.artifacts}</td>
                        <td class="p-4 text-center font-semibold text-cyan-400">${team.cycleTime}s</td>
                        <td class="p-4 text-center">
                            <div class="inline-block px-2.5 py-1 rounded bg-slate-900 border border-slate-700 font-mono text-xs text-indigo-300">
                                ${team.contribution}%
                            </div>
                        </td>
                        <td class="p-4 text-center">
                            <button onclick="deleteTeam(${index})" class="text-xs font-semibold text-rose-400 hover:text-rose-300 bg-rose-500/10 hover:bg-rose-500/20 px-2.5 py-1 rounded border border-rose-500/30 cursor-pointer transition">
                                Delete
                            </button>
                        </td>
                    </tr>
                `;
            }).join('');
        }

        sortBySelect.addEventListener('change', renderLeaderboard);
        renderLeaderboard();
    </script>
</body>
</html>
